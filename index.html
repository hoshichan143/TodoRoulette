<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>Document</title>
  </head>
  <body>
    <div id="container">
      <!-- SVGは「回す」ボタンを押すまで非表示 -->
      <svg
        width="90%"
        height="90%"
        viewbox="0 0 100 100"
        visibility="hidden"
        opacity="0"
        id="svgRouletteBase"
        class="fadein-out"
        xmlns="http://www.w3.org/2000/svg"
      >
        <!-- ドロップシャドウを定義 -->
        <defs>
          <!-- 影が途切れるのでwとhを既定より拡大　乗算で合成する -->
          <filter id="shadow" x="-20%" y="-10%" width="200%" height="200%">
            <feDropShadow
              dx="0"
              dy="0"
              stdDeviation="1"
              flood-opacity="0.8"
              flood-color="SteelBlue"
              result="dropShadow"
            />
            <!--<feBlend in="SourceGraphic" in2="dropShadow" mode="screen" />-->
          </filter>
        </defs>
        <g id="svgRouletteBoard" xmlns="http://w3.org">
          <circle
            cx="50"
            cy="50"
            r="40"
            fill="blue"
            id="svgRouletteCircle"
            filter="url(#shadow)"
          />
        </g>
        <polygon
          points="47,7.5 53,7.5 50,12.7"
          fill="red"
          stroke="white"
          stroke-width="0.7"
          id="svgRouletteTri"
          filter="url(#shadow)"
        />
      </svg>
      <div id="blackoutCover" class="fadein-out"></div>
      <!--暗転用空要素 -->
      <p>今日は何する～？</p>
      <div id="divTodoList">
        <ul id="ulTodoList"></ul>
      </div>
      <div id="buttons">
        <input type="button" value="止める！" id="stopBtn" class="fadein-out" />
        <input type="button" value="回す！" id="rouletteBtn" />
        <input type="button" value="増やす" id="addListBtn" />
      </div>
    </div>
    <script src="./JS/script.js"></script>
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  </body>
</html>
